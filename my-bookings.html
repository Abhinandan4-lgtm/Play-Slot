<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Bookings - PlaySlot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="my-bookings">
  <div id="site-navbar"></div>

  <header class="page-header">
    <div class="container"><h1>My bookings</h1><p>Review your upcoming and past games, or cancel a slot you cannot make.</p></div>
  </header>

  <main class="container py-4">
    <form class="filter-bar mb-4" id="lookupForm">
      <div class="row g-3 align-items-end">
        <div class="col-md-6"><label class="form-label" for="lookupEmail">Show bookings for this email</label>
          <input type="email" class="form-control" id="lookupEmail" required>
          <div class="invalid-feedback">Enter a valid email address.</div></div>
        <div class="col-md-3 d-grid"><button class="btn btn-navy" type="submit">Show bookings</button></div>
        <div class="col-md-3 text-md-end"><span class="text-muted small" id="lookupHint"></span></div>
      </div>
    </form>

    <div id="bookingsArea"></div>
  </main>

  <div id="site-footer"></div>
  <div id="confirmHost"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
